name: Citadel CI - Vault & Doctrine Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-vault:
    name: Validate Vault Integrity & PowerShell AST
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Citadel Automated Test Suite
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\tests\Vault.Tests.ps1
