name: Citadel CI - Vault & Doctrine Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-vault:
    name: Validate Vault Integrity & PowerShell AST
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Vault Test Suite with Pester
        shell: powershell
        run: |
          Write-Host "Running Citadel Automated Test Suite..." -ForegroundColor Cyan
          $result = Invoke-Pester -Path .\tests\Vault.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) {
              Write-Error "CI Failed: $($result.FailedCount) test(s) failed."
              exit 1
          }
          Write-Host "All $($result.PassedCount) tests passed successfully!" -ForegroundColor Green
